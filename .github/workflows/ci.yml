name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Compile check + logic tests (bez Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update && sudo apt-get install -y mono-mcs mono-runtime
      - name: Compile against Unity 2021.3 reference assemblies
        run: Tools/ci/compile-check.sh
      - name: Logic tests (EditMode tests on a Unity API shim)
        run: Tools/ci/logic-tests.sh

  unity:
    # Skutečné testy a buildy v Unity. Potřebují licenci v secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
    # (návod: https://game.ci/docs/github/activation). Bez nich se kroky přeskočí.
    name: Unity ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [StandaloneWindows64, Android]
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check for Unity license
        id: license
        run: |
          if [ -n "$UNITY_LICENSE" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; echo "No UNITY_LICENSE secret - skipping Unity steps."; fi
      - uses: actions/checkout@v4
        if: steps.license.outputs.available == 'true'
      - uses: actions/cache@v4
        if: steps.license.outputs.available == 'true'
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-
      - name: EditMode tests
        if: steps.license.outputs.available == 'true' && matrix.targetPlatform == 'StandaloneWindows64'
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
          unityVersion: 2021.3.15f1
      - name: Build
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          unityVersion: 2021.3.15f1
      - uses: actions/upload-artifact@v4
        if: steps.license.outputs.available == 'true'
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
